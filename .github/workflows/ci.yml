name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEXT_PUBLIC_BASE_PATH: /dddavidsm
  NEXT_PUBLIC_SITE_ORIGIN: https://dddavidsm.github.io

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: QUALITY
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:links
      - name: Lighthouse collect
        run: npx @lhci/cli@0.15.x collect
      - name: Lighthouse metrics
        run: node scripts/report-lighthouse.mjs
      - name: Lighthouse assertions
        run: npx @lhci/cli@0.15.x assert
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: DEPLOY
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
