name: Maintenance Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-eslint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Upgrade ESLint to supported major
        run: npm install --save-dev eslint@^10.9.1 --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls eslint eslint-config-next typescript-eslint --depth=2
      - name: Verify lint after upgrade
        run: npm run lint
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git commit -m "chore: update eslint to supported major"
            git push
          fi
