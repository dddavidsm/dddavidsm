name: Maintenance Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-and-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency tree
        run: npm ls eslint eslint-config-next typescript-eslint --depth=2
      - name: Outdated dependencies
        run: npm outdated || true
      - name: Normalize link test
        run: npx prettier --write tests/links.spec.ts
      - name: Commit normalized test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/links.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: format link validation test"
            git push
          fi
